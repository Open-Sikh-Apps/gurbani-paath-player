name: Catalogue

on:
  pull_request:
    paths:
      - "src/catalogue/schema.ts"
      - "src/catalogue/parse-catalogue.ts"
      - "src/catalogue/mock-catalogue.json"
      - "scripts/validate-catalogue.ts"
  push:
    paths:
      - "src/catalogue/schema.ts"
      - "src/catalogue/parse-catalogue.ts"
      - "src/catalogue/mock-catalogue.json"
      - "scripts/validate-catalogue.ts"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run catalogue:validate
